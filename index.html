<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to my website</h1>
  <p>This website was created using VS Code.</p>

  <label for="pinInput">Enter your PIN:</label>
  <input type="text" id="pinInput" inputmode="numeric" pattern="[0-9]+" placeholder="123456" autocomplete="one-time-code">

  <button id="helloButton">Connect</button>
  <p id="statusMessage" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
